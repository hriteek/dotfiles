# Terminal multiplexer
# https://github.com/tmux/tmux

# source-file ~/.config/tmux/tmux.reset.conf

# set -g @continuum-restore 'on'

unbind r
bind r source-file ~/.tmux.conf # reload tmux confir

set -g prefix C-a # set prefix to Ctrl + a
set -g mouse on               # enable mouse support
set -g base-index 1           # starting indexing at 1 instead of 0
set -g pane-base-index 1
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g history-limit 1000000  # significantly increase history size
set -g renumber-windows on    # renumber all windows when any window is closed
set -g set-clipboard on       # use system clipboard
set-window-option -g automatic-rename on # Automatically set window title
set-option -g set-titles on

# color for terminal
set-option -g default-terminal        'screen-256color'
set-option -g terminal-overrides      ',xterm-256color:RGB'

set-option -g status-position top

# Navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Split panes with | and - in current directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Resize panes quickly with Shift + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# for yazi terminal fileexplorer
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Pane borders
set -g pane-border-style "fg=#f38ba8"
set -g pane-active-border-style "fg=#f9e2af"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# for theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour 'mocha'
# set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_date_time_icon ""
set -g @catppuccin_date_time_color "#{@thm_mauve}"
set -g @catppuccin_date_time_text " %Y-%m-%d %H:%M"

set -g @catppuccin_directory_text "#{pane_current_path}"

# for restore session
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_date_time}"

# # Custom status bar (overrides theme defaults)
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#cba6f7,nobold]"

set -g status-right-length 120
set -g status-right "#[fg=#45475a,bg=#1e1e2e]#[fg=#cdd6f4,bg=#45475a] #{s|^.*?/([^/]+/[^/]+)$|\\1|:pane_current_path} #[fg=#313244,bg=#45475a]#[fg=#f9e2af,bg=#313244] %Y-%m-%d #[fg=#f9e2af,bg=#313244]#[fg=#1e1e2e,bg=#f9e2af,bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a6adc8,bg=#313244] #I:#W #[fg=#313244,bg=#1e1e2e,nobold]"
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold] #I:#W #[fg=#cba6f7,bg=#1e1e2e,nobold]"
setw -g window-status-activity-style "fg=#fab387,bold"
setw -g window-status-bell-style "fg=#1e1e2e,bg=#f38ba8,bold"

set -g message-style "fg=#1e1e2e,bg=#a6e3a1,bold"
set -g message-command-style "fg=#1e1e2e,bg=#94e2d5,bold"
